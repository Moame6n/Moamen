<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> أدوات واختبارات محاسبية</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(to right, #f8fbff, #e0eafc);
    padding: 40px 20px;
    text-align: center;
  }
  h1 {
    color: #2c3e50;
    margin-bottom: 30px;
    font-size: 30px;
    animation: fadeInDown 1s ease forwards;
  }
  .tools-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .tool-card {
    background: linear-gradient(135deg, #ffffff, #f1f6fc);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
    animation: fadeInUp 0.8s ease forwards;
    position: relative;
  }
  .tool-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
  }
  .tool-card i {
    font-size: 2.2rem;
    color: #2980b9;
    margin-bottom: 10px;
  }
  .tool-card h3 {
    color: #34495e;
    margin-bottom: 10px;
    font-size: 20px;
  }
  .tool-card p {
    font-size: 15px;
    color: #555;
  }
  footer {
    margin-top: 60px;
    font-size: 14px;
    color: #666;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #e6ecf3);
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 28px;
      animation: fadeInDown 1s ease forwards;
    }
    .tools-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .tool-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.4s ease, background 0.4s ease;
      cursor: pointer;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
    }
    .tool-card:hover {
      transform: translateY(-5px);
      background-color: #eef5fb;
    }
    .tool-card h3 {
      color: #34495e;
      margin-bottom: 10px;
    }
    .tool-card p {
      font-size: 15px;
      color: #555;
    }
    footer {
      margin-top: 60px;
      font-size: 14px;
      color: #666;
    }@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body>  <h1> أدوات واختبارات محاسبية</h1>  <div class="tools-container" id="toolsContainer">
    <!-- سيتم توليد الأدوات ديناميكياً -->
  </div>  <footer>
    © 2025 مؤمن أحمد | مؤمن والمحاسبة - جميع الحقوق محفوظة
  </footer>  <script>
    const tools = [
{
        title: " اختبار محاسبة التكاليف",
        link: "tests.html",
        description: "اختبار شامل لفهم مدى إتقانك لمفاهيم محاسبة التكاليف."
      },
      {
        title: " اختبار مبادئ المحاسبة",
        link: "https://moame6n.github.io/Tools/",
        description: "اختبر معلوماتك في مبادئ المحاسبة من خلال اختبار تفاعلي مميز."
      },
      {
        title: " تحليل القوائم المالية (قريبًا)",
        link: "#",
        description: "أداة تساعدك على تحليل ميزانيتك باستخدام مؤشرات مالية شهيرة."
      }
    ];

    const container = document.getElementById("toolsContainer");

    tools.forEach((tool, index) => {
      const card = document.createElement("div");
      card.className = "tool-card";
      card.style.animationDelay = `${index * 0.2}s`;

      card.innerHTML = `
        <i class="fas fa-file-lines"></i>
        <h3><a href="${tool.link}" style="text-decoration: none; color: #2980b9;">${tool.title}</a></h3>
        <p>${tool.description}</p>
      `;

      container.appendChild(card);
    });
  </script></body>
</html>
