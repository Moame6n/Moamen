<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 اختبار محاسبة التكاليف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3a0ca3;
      --accent-color: #f72585;
      --success-color: #4cc9f0;
      --warning-color: #ff9e00;
      --text-dark: #2b2d42;
      --text-light: #8d99ae;
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #dfe7f1 100%);
      --card-shadow: 0 12px 30px rgba(67, 97, 238, 0.15);
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-gradient);
      padding: 40px 20px;
      text-align: center;
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      position: relative;
      padding: 20px 0 40px;
      margin-bottom: 20px;
    }
    
    h1 {
      color: var(--text-dark);
      font-size: 2.5rem;
      font-weight: 700;
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 0 20px;
    }
    
    .subtitle {
      color: var(--text-light);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }
    
    .back-btn {
      position: absolute;
      top: 25px;
      right: 35px;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Cairo';
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
      z-index: 10;
    }
    
    .back-btn:hover {
      background: var(--secondary-color);
      transform: translateX(-5px) scale(1.05);
      box-shadow: 0 6px 20px rgba(58, 12, 163, 0.4);
    }
    
    .user-info {
      background: white;
      border-radius: 25px;
      padding: 40px;
      box-shadow: var(--card-shadow);
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }
    
    .user-info::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(to right, var(--accent-color), var(--success-color));
    }
    
    .user-info h2 {
      margin-bottom: 25px;
      color: var(--primary-color);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .input-group {
      position: relative;
      margin: 25px 0;
    }
    
    .user-info input {
      width: 100%;
      padding: 16px 25px;
      border: 2px solid #eef2f7;
      border-radius: 15px;
      font-size: 1.1rem;
      transition: var(--transition);
      text-align: right;
      background: #f8fafc;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    
    .user-info input:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.2);
      background: white;
    }
    
    .user-info input::placeholder {
      color: #a8b2c1;
    }
    
    .start-btn {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }
    
    .start-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(58, 12, 163, 0.5);
    }
    
    .start-btn:active {
      transform: translateY(1px);
    }
    
    .quiz-container {
      max-width: 850px;
      margin: 40px auto;
      background: white;
      border-radius: 25px;
      padding: 40px;
      box-shadow: var(--card-shadow);
      text-align: right;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }
    
    .quiz-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(to right, var(--accent-color), var(--success-color));
    }
    
    #quizProgress {
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 30px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f4f8;
    }
    
    .progress-bar {
      height: 10px;
      background: #e9ecef;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, var(--accent-color), var(--success-color));
      width: 0%;
      transition: width 0.6s ease;
    }
    
    .question-container {
      margin: 25px 0 35px;
      padding: 20px 0;
      position: relative;
    }
    
    .difficulty {
      position: absolute;
      top: -15px;
      left: 0;
      background: var(--primary-color);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    
    .question {
      font-size: 1.4rem;
      margin-bottom: 25px;
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.5;
    }
    
    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-bottom: 30px;
    }
    
    .option {
      padding: 18px 25px;
      background: #f8fafc;
      border-radius: 15px;
      cursor: pointer;
      transition: var(--transition);
      border: 2px solid #eef2f7;
      text-align: right;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    .option:hover {
      transform: translateX(-5px);
      border-color: var(--primary-color);
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.1);
    }
    
    .option.selected {
      border-color: var(--primary-color);
      background: linear-gradient(to right, rgba(67, 97, 238, 0.08), rgba(67, 97, 238, 0.03));
      transform: translateX(-8px);
      box-shadow: 0 8px 20px rgba(67, 97, 238, 0.15);
    }
    
    .option.selected::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--primary-color);
    }
    
    .option-number {
      background: #e9ecef;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 15px;
      flex-shrink: 0;
      font-weight: 700;
      color: var(--text-dark);
      transition: var(--transition);
    }
    
    .option.selected .option-number {
      background: var(--primary-color);
      color: white;
    }
    
    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 15px;
    }
    
    .quiz-btn {
      padding: 14px 35px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: var(--transition);
      font-family: 'Cairo';
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    .next-btn {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
    }
    
    .next-btn:hover {
      transform: translateX(-5px) scale(1.05);
      box-shadow: 0 6px 20px rgba(58, 12, 163, 0.3);
    }
    
    .submit-btn {
      background: linear-gradient(to right, #2ecc71, #27ae60);
      color: white;
      display: none;
    }
    
    .submit-btn:hover {
      transform: translateX(-5px) scale(1.05);
      box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
    }
    
    .result {
      display: none;
      margin-top: 40px;
      padding: 40px;
      background: #f8f9fa;
      border-radius: 20px;
      text-align: center;
      border: 2px dashed var(--primary-color);
      position: relative;
      overflow: hidden;
    }
    
    .result::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(to right, var(--accent-color), var(--success-color));
    }
    
    .result h3 {
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 2rem;
      position: relative;
      padding-bottom: 15px;
    }
    
    .result h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: var(--accent-color);
      border-radius: 2px;
    }
    
    .score-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 25px auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: conic-gradient(var(--success-color) 0% var(--score-percent), #f0f4f8 var(--score-percent) 100%);
      box-shadow: 0 8px 25px rgba(76, 201, 240, 0.3);
    }
    
    .score-circle::before {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: white;
    }
    
    .score-content {
      position: relative;
      z-index: 1;
    }
    
    #scoreText {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0;
    }
    
    #scoreRatio {
      font-size: 1.2rem;
      color: var(--text-light);
      font-weight: 600;
    }
    
    #resultFeedback {
      margin-top: 25px;
      line-height: 1.7;
      font-size: 1.15rem;
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
      background: rgba(76, 201, 240, 0.08);
      border-radius: 15px;
      border-left: 4px solid var(--success-color);
    }
    
    .retry-btn {
      background: linear-gradient(to right, var(--accent-color), #d0006f);
      color: white;
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 1.1rem;
    }
    
    .retry-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(247, 37, 133, 0.4);
    }
    
    footer {
      margin-top: 80px;
      font-size: 1rem;
      color: var(--text-light);
      padding: 25px 0;
      border-top: 1px solid #e9ecef;
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .animate-pulse {
      animation: pulse 2s infinite;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        padding: 20px 15px;
      }
      
      h1 {
        font-size: 2rem;
        padding: 0 15px;
      }
      
      .subtitle {
        font-size: 1rem;
        padding: 0 15px;
      }
      
      .back-btn {
        top: 20px;
        right: 20px;
        padding: 8px 15px;
        font-size: 0.9rem;
      }
      
      .user-info, .quiz-container {
        padding: 30px 20px;
      }
      
      .question {
        font-size: 1.2rem;
      }
      
      .option {
        padding: 15px 20px;
        font-size: 1rem;
      }
      
      .quiz-btn {
        padding: 12px 25px;
        font-size: 1rem;
      }
      
      .score-circle {
        width: 150px;
        height: 150px;
      }
      
      .score-circle::before {
        width: 120px;
        height: 120px;
      }
      
      #scoreText {
        font-size: 2rem;
      }
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 1.7rem;
      }
      
      .user-info h2 {
        font-size: 1.5rem;
      }
      
      .navigation {
        flex-direction: column;
      }
      
      .quiz-btn {
        width: 100%;
        justify-content: center;
      }
      
      .back-btn {
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <button class="back-btn" onclick="window.location.href='tools.html'">
        <i class="fas fa-arrow-left"></i> رجوع
      </button>

      <h1 class="animate__animated animate__fadeInDown"><i class="fas fa-calculator"></i> اختبار محاسبة التكاليف</h1>
      <p class="subtitle animate__animated animate__fadeIn">اختبر معرفتك في مبادئ محاسبة التكاليف من خلال 20 سؤالاً متدرج الصعوبة</p>
    </header>

    <div class="user-info animate__animated animate__fadeInUp" id="userInfo">
      <h2><i class="fas fa-user-circle"></i> معلومات المختبر</h2>
      <div class="input-group">
        <input type="text" id="userName" placeholder="أدخل اسمك بالكامل" required>
      </div>
      <button id="startBtn" class="start-btn animate-pulse">
        <i class="fas fa-play"></i> بدء الاختبار
      </button>
    </div>

    <div class="quiz-container" id="quizContainer" style="display:none;">
      <div id="quizProgress">
        <span id="progressText">السؤال 1 من 20</span>
        <span id="timer"><i class="fas fa-clock"></i> 05:00</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-container">
        <div class="difficulty" id="difficulty">سهل</div>
        <div class="question" id="question"></div>
      </div>
      
      <div class="options" id="options"></div>

      <div class="navigation">
        <button class="quiz-btn next-btn" id="nextBtn">
          التالي <i class="fas fa-arrow-left"></i>
        </button>
        <button class="quiz-btn submit-btn" id="submitBtn">
          <i class="fas fa-paper-plane"></i> تسليم الإجابات
        </button>
      </div>

      <div class="result" id="result">
        <h3 id="resultTitle">نتيجة الاختبار</h3>
        <p id="userGreeting"></p>
        
        <div class="score-circle">
          <div class="score-content">
            <div id="scoreText">0%</div>
            <div id="scoreRatio">0/20</div>
          </div>
        </div>
        
        <p id="resultFeedback"></p>
        <button class="quiz-btn retry-btn" id="retryBtn">
          <i class="fas fa-redo"></i> إعادة المحاولة
        </button>
      </div>
    </div>

    <footer>
      © 2025 مؤمن أحمد | مؤمن والمحاسبة - جميع الحقوق محفوظة
    </footer>
  </div>

  <script>
    const quizQuestions = [
      {
        question: "ما هو الهدف الأساسي من محاسبة التكاليف؟",
        options: [
          "تحديد تكلفة المنتجات والخدمات",
          "حساب رواتب الموظفين",
          "إعداد الميزانية العمومية",
          "تحليل السوق التنافسي"
        ],
        answer: 0,
        difficulty: "سهل"
      },
      {
        question: "أي من التالي يعتبر تكلفة مباشرة؟",
        options: [
          "الخشب المستخدم في صناعة الأثاث",
          "رواتب المديرين",
          "إيجار المصنع",
          "مصاريف الكهرباء العامة"
        ],
        answer: 0,
        difficulty: "سهل"
      },
      {
        question: "ما الفرق بين التكاليف الثابتة والمتغيرة؟",
        options: [
          "الثابتة لا تتغير بحجم الإنتاج بينما المتغيرة تتغير",
          "المتغيرة لا تتغير أبداً",
          "الثابتة تتغير يومياً",
          "لا يوجد فرق بينهما"
        ],
        answer: 0,
        difficulty: "سهل"
      },
      {
        question: "ما هو العنصر الذي لا يعتبر من عناصر التكلفة؟",
        options: [
          "تكلفة المواد",
          "تكلفة العمالة",
          "تكلفة الإنتاج",
          "تكلفة التسويق"
        ],
        answer: 3,
        difficulty: "سهل"
      },
      {
        question: "كيف تحسب تكلفة الوحدة الواحدة؟",
        options: [
          "إجمالي التكاليف ÷ عدد الوحدات المنتجة",
          "إجمالي التكاليف × عدد الوحدات المنتجة",
          "إجمالي التكاليف + هامش الربح",
          "إجمالي التكاليف - الخصومات"
        ],
        answer: 0,
        difficulty: "سهل"
      },
      {
        question: "ما هي التكلفة الغارقة (Sunk Cost)؟",
        options: [
          "تكلفة لا يمكن استرجاعها",

        ],
        answer: 0,

      },
      {
        question: "ما هو الغرض من حساب نقطة التعادل؟",
        options: [
          "تحديد حجم المبيعات اللازم لتغطية التكاليف",
          "حساب الربح التشغيلي",
          "تحديد سعر البيع الأمثل",
          "جميع ما سبق"
        ],
        answer: 3,
        difficulty: "متوسط"
      },
      {
        question: "ما هي التكلفة الحدية (Marginal Cost)؟",
        options: [
          "التكلفة الإضافية لإنتاج وحدة إضافية",
          "التكلفة الكلية للإنتاج",
          "متوسط تكلفة الوحدة",

        ],
        answer: 0,
        difficulty: "متوسط"
      },
      {
        question: "ما هو نظام التكاليف على أساس الأنشطة (ABC)؟",
        options: [
          "نظام يحسب التكلفة بناءً على الأنشطة المستهلكة",
          "نظام لحساب رواتب الموظفين",
          "طريقة لتسجيل المشتريات فقط",
          "نظام محاسبة مالية بحت"
        ],
        answer: 0,
        difficulty: "متوسط"
      },
      {
        question: "ما الفرق بين محاسبة التكاليف والمحاسبة المالية؟",
        options: [
          "محاسبة التكاليف تركز على التكاليف الداخلية بينما المالية تركز على التقارير الخارجية",

          "لا يوجد فرق بينهما",
          "محاسبة التكاليف خاصة بالحكومة بينما المالية خاصة بالشركات"
        ],
        answer: 0,
        difficulty: "متوسط"
      },
      {
        question: "ما هي نقطة التعادل (Break-even Point)؟",
        options: [
          "النقطة التي تتساوى فيها الإيرادات مع التكاليف",
          "نهاية السنة المالية",
          "وقت تسليم المنتج للعميل",
          "بداية عملية الإنتاج"
        ],
        answer: 0,
        difficulty: "صعب"
      },
      {
        question: "كيف يتم تحميل التكاليف الصناعية غير المباشرة؟",
        options: [
          "باستخدام معدلات تحميل محددة مسبقاً",
          "بإضافتها مباشرة لكل منتج",
          "بتجاهلها تماماً",
          "بخصمها من الإيرادات"
        ],
        answer: 0,
        difficulty: "صعب"
      },
      {
        question: "ما هي تكلفة الفرصة البديلة؟",
        options: [
          "أفضل بديل تم التخلي عنه لصالح البديل المختار",
          "تكلفة المواد المستخدمة",
          "تكلفة العمالة المباشرة",

    let currentQuestion = 0;
    let userAnswers = [];
    let userName = "";
    let timer;
    let timeLeft = 300; // 5 minutes in seconds

    const quizContainer = document.getElementById('quizContainer');
    const startBtn = document.getElementById('startBtn');
    const userNameInput = document.getElementById('userName');
    const retryBtn = document.getElementById('retryBtn');
    const userInfo = document.getElementById('userInfo');
    const progressFill = document.getElementById('progressFill');
    const timerDisplay = document.getElementById('timer');
    const difficultyDisplay = document.getElementById('difficulty');

    startBtn.addEventListener('click', () => {
      if (userNameInput.value.trim() === "") {
        showAlert("الرجاء إدخال اسمك قبل بدء الاختبار", "warning");
        userNameInput.focus();
        return;
      }
      
      userName = userNameInput.value.trim();
      quizContainer.style.display = "block";
      userInfo.style.display = "none";
      
      // Start timer
      startTimer();
      
      // Start quiz
      startQuiz();
    });

    retryBtn.addEventListener('click', () => {
      currentQuestion = 0;
      userAnswers = [];
      document.getElementById('result').style.display = "none";
      userInfo.style.display = "block";
      quizContainer.style.display = "none";
      userNameInput.value = userName;
      timeLeft = 300;
      clearInterval(timer);
      timerDisplay.innerHTML = `<i class="fas fa-clock"></i> 05:00`;
    });

    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.innerHTML = `<i class="fas fa-clock"></i> ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) {
          clearInterval(timer);
          submitQuiz();
          showAlert("انتهى الوقت المخصص للاختبار!", "danger");
        }
      }, 1000);
    }

    function startQuiz() {
      showQuestion();
    }

    function showQuestion() {
      const questionObj = quizQuestions[currentQuestion];
      document.getElementById('question').textContent = questionObj.question;
      document.getElementById('progressText').textContent = `السؤال ${currentQuestion + 1} من ${quizQuestions.length}`;
      difficultyDisplay.textContent = questionObj.difficulty;
      
      // Update progress bar
      const progressPercent = ((currentQuestion + 1) / quizQuestions.length) * 100;
      progressFill.style.width = `${progressPercent}%`;
      
      // Set difficulty color
      switch(questionObj.difficulty) {
        case "سهل":
          difficultyDisplay.style.background = "#2ecc71";
          break;
        case "متوسط":
          difficultyDisplay.style.background = "#ff9e00";
          break;
        case "صعب":
          difficultyDisplay.style.background = "#e74c3c";
          break;
        case "صعب جداً":
          difficultyDisplay.style.background = "#9b59b6";
          break;
      }
      
      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';
      
      questionObj.options.forEach((option, index) => {
        const optionElement = document.createElement('div');
        optionElement.className = 'option';
        
        optionElement.innerHTML = `
          <div class="option-text">${option}</div>
          <div class="option-number">${index + 1}</div>
        `;
        
        optionElement.onclick = function() { selectOption(this); };
        optionsContainer.appendChild(optionElement);
      });
      
      // Highlight selected option if exists
      if (userAnswers[currentQuestion] !== undefined) {
        const options = document.querySelectorAll('.option');
        options[userAnswers[currentQuestion]].classList.add('selected');
      }
      
      if (currentQuestion === quizQuestions.length - 1) {
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'flex';
      } else {
        document.getElementById('nextBtn').style.display = 'flex';
        document.getElementById('submitBtn').style.display = 'none';
      }
    }

    function selectOption(selectedElement) {
      const options = document.querySelectorAll('.option');
      options.forEach(option => {
        option.classList.remove('selected');
      });
      
      selectedElement.classList.add('selected');
      userAnswers[currentQuestion] = Array.from(options).indexOf(selectedElement);
    }

    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('submitBtn').addEventListener('click', submitQuiz);

    function nextQuestion() {
      if (userAnswers[currentQuestion] === undefined) {
        showAlert('الرجاء اختيار إجابة للمتابعة', 'warning');
        return;
      }
      
      currentQuestion++;
      showQuestion();
    }

    function submitQuiz() {
      clearInterval(timer);
      
      if (userAnswers[currentQuestion] === undefined) {
        showAlert('الرجاء اختيار إجابة قبل التسليم', 'warning');
        return;
      }
      
      let score = 0;
      quizQuestions.forEach((question, index) => {
        if (userAnswers[index] === question.answer) {
          score++;
        }
      });
      
      // Calculate percentage
      const scorePercent = Math.round((score / quizQuestions.length) * 100);
      
      // Set the score circle gradient
      document.documentElement.style.setProperty('--score-percent', `${scorePercent}%`);
      
      // Display result
      document.getElementById('userGreeting').textContent = `أهلاً ${userName}، هذه هي نتيجتك:`;
      document.getElementById('scoreText').textContent = `${scorePercent}%`;
      document.getElementById('scoreRatio').textContent = `${score}/${quizQuestions.length}`;
      
      if (scorePercent >= 90) {
        document.getElementById('resultFeedback').innerHTML = `
          <span style="color: #27ae60; font-weight: 700;">نتيجة استثنائية! 🏆</span><br>
          أداء متميز! لديك فهم عميق لمحاسبة التكاليف، استمر في هذا التميز.
        `;
      } else if (scorePercent >= 70) {
        document.getElementById('resultFeedback').innerHTML = `
          <span style="color: #2ecc71; font-weight: 700;">نتيجة ممتازة! 👏</span><br>
          أداء جيد جداً، لديك معرفة قوية في محاسبة التكاليف، يمكنك تطوير نفسك أكثر.
        `;
      } else if (scorePercent >= 50) {
        document.getElementById('resultFeedback').innerHTML = `
          <span style="color: #ff9e00; font-weight: 700;">نتيجة مقبولة! 💪</span><br>
          مستوى جيد، ولكن تحتاج لمراجعة بعض المفاهيم لتحسين أدائك.
        `;
      } else {
        document.getElementById('resultFeedback').innerHTML = `
          <span style="color: #e74c3c; font-weight: 700;">نحتاج إلى تحسين 📚</span><br>
          ننصحك بمراجعة أساسيات محاسبة التكاليف والمحاولة مرة أخرى لتحقيق نتيجة أفضل.
        `;
      }
      
      document.getElementById('result').style.display = 'block';
      document.getElementById('submitBtn').style.display = 'none';
      
      // Send data to Google Sheets (simulated)
      sendToGoogleSheets(userName, scorePercent);
    }

    function showAlert(message, type) {
      // Create alert element
      const alertEl = document.createElement('div');
      alertEl.className = `alert alert-${type}`;
      alertEl.textContent = message;
      alertEl.style.cssText = `
        position: fixed;
        top: 30px;
        right: 30px;
        padding: 15px 25px;
        border-radius: 10px;
        background: ${type === 'warning' ? '#ff9e00' : type === 'danger' ? '#e74c3c' : '#2ecc71'};
        color: white;
        font-weight: 600;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        z-index: 1000;
        animation: fadeInUp 0.5s ease;
      `;
      
      document.body.appendChild(alertEl);
      
      // Remove after 3 seconds
      setTimeout(() => {
        alertEl.style.animation = 'fadeOut 0.5s ease';
        setTimeout(() => {
          document.body.removeChild(alertEl);
        }, 500);
      }, 3000);
    }

    function sendToGoogleSheets(name, score) {
      // In a real scenario, this would send data to Google Sheets
      console.log(`تم إرسال النتيجة: ${name} - ${score}%`);
      
      // Simulate success message
      setTimeout(() => {
        showAlert('تم حفظ نتائجك بنجاح!', 'success');
      }, 1000);
    }
  </script>
